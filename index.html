<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f1a" />
    <title>Duʿāʾ Player — Loop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: '#070a12',
              panel: 'rgba(255,255,255,0.06)',
              panelHover: 'rgba(255,255,255,0.085)',
              stroke: 'rgba(255,255,255,0.12)',
              text: 'rgba(255,255,255,0.92)',
              muted: 'rgba(255,255,255,0.68)',
              brand: {
                purple: '#7c5cff',
                green: '#22c55e',
                blue: '#38bdf8',
                orange: '#f59e0b',
              }
            },
            fontFamily: {
              sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
              arabic: ['Noto Naskh Arabic', 'Amiri', 'Scheherazade New', 'serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #070a12;
        background-image: 
          radial-gradient(1100px 700px at 10% -10%, rgba(124,92,255,0.35), transparent 60%),
          radial-gradient(900px 600px at 110% 10%, rgba(56,189,248,0.28), transparent 55%),
          radial-gradient(900px 800px at 40% 120%, rgba(34,197,94,0.17), transparent 60%);
        background-attachment: fixed;
      }
      /* Custom Range Slider */
      input[type=range] {
        -webkit-appearance: none; 
        background: transparent; 
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px; width: 16px;
        border-radius: 50%;
        background: #e2e8f0;
        cursor: pointer;
        margin-top: -6px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%; height: 4px;
        cursor: pointer;
        background: rgba(255,255,255,0.2);
        border-radius: 2px;
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0"
  }
}
</script>
</head>
  <body class="antialiased text-text min-h-screen selection:bg-brand-blue selection:text-white">
    <div id="root"></div>
  </body>
</html>
